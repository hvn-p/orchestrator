[package]
name = "orchestrator"
version = "0.1.0"
edition = "2024"
description = "Keeps parallel Claude Code sessions working within the finite resources of one Linux machine"
license = "GPL-3.0-or-later"
repository = "https://github.com/hvn-p/orchestrator"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
brush-parser = "0.4.0"
clap = { version = "4.6.7", features = ["derive"] }
inotify = { version = "0.11.5", default-features = false }
rustix = { version = "1.1.5", features = ["event", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
# pid and ppid are the domain's own names.
similar_names = "allow"
# The library only serves this crate's two binaries; it is not a public API.
missing_errors_doc = "allow"
must_use_candidate = "allow"
